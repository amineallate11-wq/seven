<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SEVEN 7 SCRUBS — Beyond the Uniform</title>
  <meta name="description" content="SEVEN 7 SCRUBS — Nouvelle collection 320 MAD. Pyjamas de bloc chirurgicaux haute performance.">
  <link rel="icon" type="image/svg+xml" href="./images/brand/logo.svg">
  
  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./css/style.css?v=modernLookbook2026">
  <style>
    .intro-standalone-card {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #090a0d;
    }
    .intro-bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    .intro-gradient-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60%;
      background: linear-gradient(to top, rgba(9, 10, 13, 0.98) 0%, rgba(9, 10, 13, 0.6) 50%, transparent 100%);
      z-index: 2;
    }
    .intro-top-bar {
      position: relative;
      z-index: 3;
      padding: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .intro-skip-btn {
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      text-decoration: none;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .intro-body-content {
      position: relative;
      z-index: 3;
      padding: 1.5rem 1.25rem;
    }
    .intro-pill-badge {
      display: inline-block;
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      margin-bottom: 0.65rem;
    }
    .intro-brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      line-height: 1.1;
      margin-bottom: 0.35rem;
    }
    .intro-brand-title span {
      color: var(--blue-royal);
    }
    .intro-tagline {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      display: block;
      margin-bottom: 0.65rem;
    }
    .intro-subtext {
      font-size: 0.85rem;
      font-style: italic;
      color: var(--text-secondary);
      line-height: 1.4;
      margin-bottom: 1.25rem;
    }
    .intro-cta-button {
      width: 100%;
      height: 48px;
      background: var(--blue-gradient);
      color: #fff;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      border-radius: var(--radius-pill);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 24px var(--blue-glow);
    }
    .intro-progress-track {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 1rem;
    }
    .intro-progress-bar {
      width: 0%;
      height: 100%;
      background: var(--gold-accent);
      transition: width 3.5s linear;
    }
    .intro-progress-bar.animate {
      width: 100%;
    }
  </style>
</head>
<body class="app-stage-body">

  <div class="luxury-presentation-wrap">
    
    <div class="mobile-app-card" id="mobileAppCard">
      
      <div class="intro-standalone-card" id="introContainer">
        <img class="intro-bg-img" src="./images/brand/hero-duo-poster.png" alt="SEVEN 7 SCRUBS — Campagne 2026">
        <div class="intro-gradient-bottom"></div>

        <!-- Intro Top Header -->
        <div class="intro-top-bar">
          <img src="./images/brand/logo-seven-scrubs-white.png" alt="SEVEN 7 SCRUBS" style="height:20px; width:auto;">
          <a href="index.html" class="intro-skip-btn" title="Accéder à la boutique">
            <span>Boutique</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </a>
        </div>

        <!-- Intro Bottom Content -->
        <div class="intro-body-content">
          <span class="intro-pill-badge">NOUVELLE COLLECTION 2026 • 320 MAD</span>
          <h1 class="intro-brand-title">
            SEVEN<span>7</span> SCRUBS
          </h1>
          <span class="intro-tagline">BEYOND THE UNIFORM</span>
          <p class="intro-subtext">« Inspiré par la rue. Pensé pour ceux qui soignent. »</p>

          <a href="index.html" class="intro-cta-button">
            <span>DÉCOUVRIR LES MODÈLES (320 MAD)</span>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </a>

          <!-- Progress bar -->
          <div class="intro-progress-track">
            <div class="intro-progress-bar" id="introProgressBar"></div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const bar = document.getElementById('introProgressBar');
      if (bar) {
        setTimeout(() => bar.classList.add('animate'), 100);
      }
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 3500);
    });
  </script>
</body>
</html>
